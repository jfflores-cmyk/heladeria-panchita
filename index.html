<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heladería Panchita</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <main id="pantalla-inicio" class="tarjeta animar-entrada">
        <h1>Heladería Panchita</h1>
        <p class="subtitulo">¡Bienvenido! Qué gusto tenerte aquí.</p>
        <button type="button" class="btn-principal" onclick="irAPantalla('pantalla-envases')">Escoge un envase</button>
    </main>

    <main id="pantalla-envases" class="tarjeta oculta">
    <h2>Elige un envase</h2>
    <p class="subtitulo">Selecciona cómo quieres disfrutar tu helado</p>

    <div class="grid-opciones">
        <button type="button" class="opcion-btn" onclick="animarYCambiar(this, 'Cono')">🍦 En cono</button>
        <button type="button" class="opcion-btn" onclick="animarYCambiar(this, 'Vaso')">🥤 En vaso</button>
        <button type="button" class="opcion-btn" onclick="animarYCambiar(this, 'Tulipán')">🍨 En tulipán</button>
    </div>

    <button type="button" class="volver" onclick="irAPantalla('pantalla-inicio')">← Volver al inicio</button>
    </main>

    

    <script src="script.js"></script>
</body>
</html>
